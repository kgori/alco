[package]
name = "alco"
version = "0.3.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
csv = "1.3.1"
flate2 = "1.1.2"
rust-htslib = { version = "0.50.0", features = ["bzip2", "lzma"], default-features = false }

[dev-dependencies]
tempfile = "3.22.0"
